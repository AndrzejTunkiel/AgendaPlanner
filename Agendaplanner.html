<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda Planner</title>
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('agenda.theme'))||'auto'}catch(e){document.documentElement.dataset.theme='auto'}</script>
<style>
:root, html[data-theme="auto"]{
  --bg:#f3f4f7; --surface:#fff; --surface-2:#f7f8fa; --line:#e2e5eb; --line-2:#eef0f4;
  --text:#151821; --muted:#687080; --faint:#9aa1ad;
  --accent:#ff000f; --focus:#3b6cff;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.07);
  --shadow:0 12px 32px rgba(16,24,40,.12),0 2px 6px rgba(16,24,40,.06);
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --headH:86px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){html[data-theme="auto"]{
  --bg:#0e1014; --surface:#171a21; --surface-2:#1d212a; --line:#2a2f3b; --line-2:#21252f;
  --text:#e8ebf1; --muted:#9aa2b1; --faint:#677083;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45); --shadow:0 14px 36px rgba(0,0,0,.55);
  color-scheme:dark;
}}
html[data-theme="solarized-light"]{
  --bg:#fdf6e3; --surface:#fbf3da; --surface-2:#eee8d5; --line:#ddd6c1; --line-2:#eee8d5;
  --text:#657b83; --muted:#586e75; --faint:#93a1a1;
  --accent:#dc322f; --focus:#268bd2;
  --shadow-sm:0 1px 2px rgba(101,123,131,.12),0 1px 3px rgba(101,123,131,.14);
  --shadow:0 12px 32px rgba(101,123,131,.18),0 2px 6px rgba(101,123,131,.12);
  color-scheme:light;
}
html[data-theme="solarized-dark"]{
  --bg:#002b36; --surface:#073642; --surface-2:#0d4250; --line:#12495a; --line-2:#0d4250;
  --text:#839496; --muted:#657b83; --faint:#586e75;
  --accent:#dc322f; --focus:#268bd2;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow:0 14px 36px rgba(0,0,0,.6);
  color-scheme:dark;
}
html[data-theme="nord-light"]{
  --bg:#eceff4; --surface:#fff; --surface-2:#e5e9f0; --line:#d8dee9; --line-2:#e5e9f0;
  --text:#2e3440; --muted:#4c566a; --faint:#7b8698;
  --accent:#bf616a; --focus:#5e81ac;
  --shadow-sm:0 1px 2px rgba(46,52,64,.08),0 1px 3px rgba(46,52,64,.1);
  --shadow:0 12px 32px rgba(46,52,64,.14),0 2px 6px rgba(46,52,64,.08);
  color-scheme:light;
}
html[data-theme="nord-dark"]{
  --bg:#2e3440; --surface:#3b4252; --surface-2:#434c5e; --line:#4c566a; --line-2:#434c5e;
  --text:#d8dee9; --muted:#a7b0c4; --faint:#6b7690;
  --accent:#bf616a; --focus:#88c0d0;
  --shadow-sm:0 1px 2px rgba(0,0,0,.45); --shadow:0 14px 36px rgba(0,0,0,.55);
  color-scheme:dark;
}
html[data-theme="gruvbox-light"]{
  --bg:#fbf1c7; --surface:#fdf4d9; --surface-2:#ebdbb2; --line:#d5c4a1; --line-2:#ebdbb2;
  --text:#3c3836; --muted:#665c54; --faint:#928374;
  --accent:#9d0006; --focus:#076678;
  --shadow-sm:0 1px 2px rgba(60,56,54,.1),0 1px 3px rgba(60,56,54,.12);
  --shadow:0 12px 32px rgba(60,56,54,.16),0 2px 6px rgba(60,56,54,.1);
  color-scheme:light;
}
html[data-theme="gruvbox-dark"]{
  --bg:#282828; --surface:#3c3836; --surface-2:#504945; --line:#504945; --line-2:#3c3836;
  --text:#ebdbb2; --muted:#bdae93; --faint:#928374;
  --accent:#fb4934; --focus:#83a598;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow:0 14px 36px rgba(0,0,0,.6);
  color-scheme:dark;
}
html[data-theme="dracula"]{
  --bg:#282a36; --surface:#343746; --surface-2:#44475a; --line:#44475a; --line-2:#3a3d4d;
  --text:#f8f8f2; --muted:#9aa3c0; --faint:#6272a4;
  --accent:#ff5555; --focus:#bd93f9;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow:0 14px 36px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 var(--font);color:var(--text);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:12px}

.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2)}
.btn.icon{width:30px;height:30px;padding:0;justify-content:center}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.35;cursor:default}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--surface)}
.btn.primary:hover{opacity:.9}
.btn.on{background:color-mix(in srgb,var(--focus) 12%,var(--surface));border-color:color-mix(in srgb,var(--focus) 45%,var(--line));color:var(--focus)}
.btn.danger{color:#e5484d}
.btn.dangerf{background:#e5484d;border-color:#e5484d;color:#fff}
.btn.sm{height:28px;font-size:12.5px;padding:0 9px}
select.sel{height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:inherit;font:inherit;font-size:12.5px;padding:0 6px;cursor:pointer;flex:1;min-width:0}
.chk{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;cursor:pointer;white-space:nowrap;user-select:none;flex:none}
.chk:hover{background:var(--surface-2)}
.chk.on{background:color-mix(in srgb,var(--focus) 12%,var(--surface));border-color:color-mix(in srgb,var(--focus) 45%,var(--line));color:var(--focus)}
.chk input{accent-color:var(--focus);margin:0;flex:none}
.chk.sm{height:28px;font-size:12.5px;padding:0 9px}
.menu-wrap{position:relative}
.menu{position:fixed;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:250px;z-index:100}
.menu button{display:flex;width:100%;gap:12px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu svg{width:18px;height:18px;color:var(--muted);flex:none}
.menu b{display:block;font-weight:600;font-size:13px}
.menu small{display:block;color:var(--muted);font-size:11.5px}

/* Layout */
main.app{display:grid;grid-template-columns:262px 1fr auto;height:100%;min-height:0}
aside{background:var(--surface);overflow:auto;min-height:0}
#side{border-right:1px solid var(--line)}
#editor{border-left:1px solid var(--line);width:320px}
body.no-editor #editor{display:none}
#board{overflow:auto;min-height:0;position:relative}
.side-top{padding:12px 14px 12px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--surface);z-index:10}
.titlebar{display:flex;align-items:flex-start;gap:8px}
.titlebar .brand{margin-top:2px}
.brand{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(255,0,15,.3)}
.brand svg{width:16px;height:16px}
#docTitle{flex:1;min-width:0;font:650 16px/1.3 var(--font);resize:none;overflow:hidden;min-height:0;display:block;border:1px solid transparent;background:transparent;color:inherit;padding:4px 6px;border-radius:7px}
#docTitle:hover{border-color:var(--line)} #docTitle:focus{outline:none;border-color:var(--focus);background:var(--surface-2)}
#status{color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;margin:3px 0 10px 42px}
#status span.t{overflow:hidden;text-overflow:ellipsis}
#status .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;flex:none}
#status.dirty .dot{background:#f59e0b}
.tools{display:flex;gap:4px;align-items:center}
.tools .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.tools .sp{flex:1}
.opts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.panel{padding:14px 14px 8px}
.panel h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:650;display:flex;justify-content:space-between;align-items:center}
.field{position:relative}
input.txt{width:100%;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:inherit;padding:0 11px;font:inherit}
input.txt:focus,textarea:focus,.tin:focus,.din:focus,select:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}

/* Participants */
.plist{margin-top:10px;display:flex;flex-direction:column;gap:1px}
.person{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 7px;border-radius:9px;cursor:pointer}
.person:hover{background:var(--surface-2)}
.person.on{background:color-mix(in srgb,var(--focus) 12%,transparent)}
.person .meta{flex:1;min-width:0}
.person .name{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .sub{font-size:11.5px;color:var(--muted)}
.x{border:0;background:none;color:var(--faint);cursor:pointer;width:24px;height:24px;border-radius:6px;opacity:0;flex:none;font-size:13px;display:grid;place-items:center;padding:0}
.x svg{width:14px;height:14px}
.x:hover{background:var(--line-2);color:var(--text)}
.person:hover .x{opacity:1}
.person .x{display:none} .person:hover .x{display:grid}
.pcols{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pcols button{width:20px;height:20px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--c)}
.pcols button.on{outline:2px solid var(--c);outline-offset:2px}
.pcols .custom{position:relative;width:20px;height:20px;border-radius:50%;cursor:pointer;background:conic-gradient(#e5484d,#f5a524,#12b76a,#06aed5,#4f7cff,#8b5cf6,#ec4899,#e5484d)}
.pcols .custom.on{background:var(--c);outline:2px solid var(--c);outline-offset:2px}
.pcols .custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.pcols button.autob{width:auto;height:20px;border-radius:10px;padding:0 7px;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.pcols button.autob.on{outline:2px solid var(--focus);outline-offset:1px;color:var(--text)}
.pname-row{display:flex;gap:8px;align-items:center}
.person.editing{cursor:default;background:var(--surface-2);flex-direction:column;align-items:stretch;gap:6px;padding:8px}
.pedit-row{display:flex;gap:6px;align-items:center}
.pedit-row input.ini{width:64px;text-transform:uppercase;text-align:center;flex:none}
.pedit-row .sp{flex:1}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:650;flex:none;background:var(--h);letter-spacing:.02em;white-space:nowrap}
.av.i3{font-size:9px;letter-spacing:-.01em}
.av.s{width:20px;height:20px;font-size:8.5px;border:1.5px solid var(--surface);margin-left:-5px}
.av.s.i3{width:22px;font-size:7px}
.av.s:first-child{margin-left:0}
.av.s0{width:22px;height:22px;font-size:9px}
.av.s0.i3{font-size:7.5px}
.plusav{background:var(--line);color:var(--text);font-size:14px}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);z-index:60;padding:4px;max-height:300px;overflow:auto}
.ac>div{padding:6px 8px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:9px}
.ac>div.on{background:var(--surface-2)}
.ac .tag{margin-left:auto;font-size:10.5px;color:var(--faint)}
.prune{margin-top:10px;width:100%;justify-content:center;color:var(--muted)}
.prune:hover{color:#e5484d;border-color:color-mix(in srgb,#e5484d 40%,var(--line))}
.prune svg{width:14px;height:14px}
.known{border-top:1px solid var(--line-2);margin-top:12px;padding-top:14px}
.known p{margin:0 0 10px}

/* Board */
.board{display:flex;min-width:max-content;padding:0 16px 40px 0;min-height:100%}
.axis{position:sticky;left:0;z-index:8;background:var(--bg);width:54px;flex:none}
.axis-head{height:var(--headH);position:sticky;top:0;background:var(--bg);z-index:2}
.axis-body{position:relative}
.axis-body span{position:absolute;right:9px;transform:translateY(-50%);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.day{flex:1 0 300px;max-width:560px;margin-left:14px;display:flex;flex-direction:column}
.day-head{position:sticky;top:0;z-index:7;height:var(--headH);background:var(--bg);padding:10px 2px 0}
.dh1{display:flex;align-items:center;gap:8px;height:22px}
.dnum{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.wd{font-weight:650;font-size:14.5px}
.dh1 .sp{flex:1}
.ib{border:0;background:none;color:var(--faint);width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:14px;display:grid;place-items:center;padding:0;flex:none}
.ib:hover{background:var(--line-2);color:var(--text)}
.ib svg{width:15px;height:15px}
.dh2{display:flex;align-items:center;gap:5px;margin-top:5px;position:relative}
.din,.tin{height:28px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:inherit;font:inherit;font-size:12.5px;padding:0 6px;font-variant-numeric:tabular-nums}
.dh2 .din{width:96px}
.dh2 .tin{width:52px;text-align:center}
.dh2 span{color:var(--faint)}
.dpick{position:absolute;left:0;top:100%;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none}
.dh3{font-size:11.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-body{position:relative}
.win{position:absolute;left:0;right:0;border:1px solid var(--line);border-radius:14px;
  background-color:var(--surface);
  background-image:linear-gradient(var(--line-2) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--line-2) 55%,transparent) 1px,transparent 1px);
  background-size:100% calc(60px * var(--ppm)),100% calc(30px * var(--ppm));box-shadow:var(--shadow-sm)}
.edge{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;z-index:6}
.edge.top{bottom:calc(100% + 5px)} .edge.bot{top:calc(100% + 5px)}
.grip{height:22px;padding:0 9px 0 7px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;color:var(--muted);cursor:ns-resize;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow-sm);user-select:none}
.grip:hover{color:var(--text);border-color:var(--faint)}
.grip svg{width:10px;height:10px}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:12.5px;text-align:center;pointer-events:none;padding:10px}
.lanes{position:absolute;inset:0;pointer-events:none}
.rooms{position:absolute;left:8px;right:8px;top:0;bottom:0;display:flex;z-index:1;pointer-events:none}
.room{position:relative;flex:1 1 0;min-width:0;pointer-events:auto;padding:0 3px}
.room + .room{border-left:1px dashed var(--line)}
.dh4{display:flex;gap:4px;margin-top:5px;align-items:center}
.rtab{display:flex;align-items:center;gap:2px;flex:1;min-width:0;height:26px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 2px 0 7px}
.rtab input{border:0;background:none;color:inherit;font:inherit;font-size:12px;font-weight:600;width:100%;min-width:0;padding:0}
.rtab input:focus{outline:none}
.rtab .x{width:20px;height:20px;opacity:1;display:grid}
.item.span .card{border-style:dashed}
.item.ob .card{border-color:#e5484d;box-shadow:0 0 0 1px #e5484d}
.item.ob.sel .card{box-shadow:0 0 0 2px var(--focus),0 0 0 3px #e5484d}
.obw{flex:none;width:12px;height:12px;color:#e5484d;margin-top:2px}
.obw svg{width:12px;height:12px;display:block}
.item.xs .obw{margin-top:0}
.obt{color:#e5484d}
.item{position:absolute;pointer-events:auto;touch-action:none}
.item:hover{z-index:3} .item.sel{z-index:4} .item.dragging{z-index:5}
.card{position:absolute;inset:1px 3px 1px 0;border-radius:10px;background:color-mix(in srgb,var(--c) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 28%,transparent);overflow:hidden;padding:5px 7px 5px 16px;display:flex;align-items:flex-start;gap:8px;cursor:grab;transition:box-shadow .15s;user-select:none}
.card::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:4px;border-radius:4px;background:var(--c)}
.item:hover .card{box-shadow:var(--shadow-sm)}
.item.dragging .card{box-shadow:var(--shadow);cursor:grabbing}
.item.unglued .card{outline:2px dashed var(--focus);outline-offset:2px}
.item.sel .card{box-shadow:0 0 0 2px var(--focus),var(--shadow-sm)}
.item.dim{opacity:.25}
.item.brk .card{--c:var(--faint);background:repeating-linear-gradient(135deg,var(--surface-2) 0 7px,color-mix(in srgb,var(--line) 70%,var(--surface-2)) 7px 8px);border-color:var(--line)}
.item.brk .t-title{color:var(--muted);font-weight:550}
.t-time{flex:none;display:flex;flex-direction:column;font-size:11px;line-height:1.35;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.t-time .d{font-size:10.5px;color:var(--faint)}
.t-main{flex:1 1 0;min-width:72px;display:flex;flex-direction:column;overflow:hidden;align-self:stretch}
.item.xs .t-main{align-self:center}
.t-head{display:flex;align-items:flex-start;gap:5px;min-width:0}
.t-nicon{flex:none;width:12px;height:12px;color:var(--muted);margin-top:2px}
.t-nicon[hidden],.t-notes[hidden]{display:none}
.t-nicon svg{width:12px;height:12px;display:block}
.item.xs .t-nicon{margin-top:0}
.t-notes{font-size:11.5px;line-height:15px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.t-title{flex:0 1 auto;min-width:0;font-weight:620;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.t-title .pin{display:inline-block;width:11px;height:11px;margin-right:4px;color:var(--muted);vertical-align:-1px}
.t-title .pin svg{width:11px;height:11px;display:block}
.t-ppl{flex:0 1 auto;display:flex;flex-wrap:wrap;justify-content:flex-end;align-content:flex-start;max-width:62%;gap:3px;padding-left:5px}
.t-ppl .av{width:20px;height:20px;font-size:8.5px;border:0;margin:0}
.t-ppl .av.i3{font-size:7px}
.t-ppl .av[hidden],.t-ppl .more[hidden]{display:none}
.t-ppl .more{font-size:10.5px;color:var(--muted);margin-left:1px;line-height:20px}
.item.sm .t-time .d,.item.xs .t-time .d{display:none}
.item.sm .t-title{-webkit-line-clamp:1}
.item.xs .card{align-items:center;padding-top:0;padding-bottom:0}
.item.xs .t-title{-webkit-line-clamp:1;font-size:12px}
.item.xs .t-ppl{flex-wrap:nowrap}
.item.sm .t-ppl .av{width:18px;height:18px;font-size:7.5px}
.item.sm .t-ppl .more{line-height:18px}
.item.xs .t-ppl .av{width:15px;height:15px;font-size:6.5px}
.item.xs .t-ppl{gap:2px}
.item.xs .t-ppl{align-self:center}
.item.xs .t-ppl .more{line-height:15px}
.h{position:absolute;left:8px;right:8px;height:7px;cursor:ns-resize;z-index:2}
.h.top{top:0} .h.bot{bottom:0}
.item.xs .h{height:4px}
.h::after{content:"";position:absolute;left:50%;top:50%;width:26px;height:4px;margin:-2px 0 0 -13px;border-radius:3px;background:var(--c);opacity:0;transition:opacity .12s}
.item:hover .h::after,.item.sel .h::after{opacity:.65}

function renderBoard() {
  const ax = axisRange(), ppm = ui.ppm, H = (ax.e - ax.s) * ppm, today = isoToday();
  const nd = new Date(), nowM = nd.getHours() * 60 + nd.getMinutes();
  const roomsMax = Math.max(1, ...doc.days.map(d => (d.rooms || []).length));
  const headH = roomsMax > 1 ? 118 : 86;
  const cf = conflicts();
  let axis = ''; for (let m = ax.s; m <= ax.e; m += 60) axis += `<span style="top:${(m - ax.s) * ppm}px">${m >= 1440 ? '24:00' : fmt(m)}</span>`;
  const days = doc.days.map((d, i) => {
    const wt = (d.start - ax.s) * ppm, wh = (d.end - d.start) * ppm;
    const vis = visibleItems(d);
    const work = vis.filter(x => x.type !== 'break').reduce((a, x) => a + x.end - x.start, 0);
    const lastEnd = vis.length ? Math.max(...vis.map(x => x.end)) : null;
    const dayOb = vis.filter(it => cf.items.has(it.id)).length;
    const itemHtml = (it, left, width) => {
      const top = (it.start - ax.s) * ppm, h = (it.end - it.start) * ppm;
      const size = h < 26 ? 'xs' : h < 44 ? 'sm' : '';
      const ppl = peopleOf(it), notes = String(it.notes || '').trim();
      const ob = cf.items.get(it.id);
      const obNames = ob ? [...ob].map(pid => { const p = person(pid); return p ? p.name : ''; }).filter(Boolean).join(', ') : '';
      const cls = [size, it.type === 'break' ? 'brk' : '', it.pinned ? 'pinned' : '', it.spanAll ? 'span' : '', ob ? 'ob' : '', ui.sel === it.id ? 'sel' : '', ui.hl && !it.participants.includes(ui.hl) ? 'dim' : '', ui.drag && ui.drag.moved && ui.drag.itemId === it.id ? 'dragging' + (ui.drag.unglued ? ' unglued' : '') : ''].join(' ');
      return `<div class="item ${cls}" data-id="${it.id}" style="top:${top}px;height:${h}px;left:${left}%;width:${width}%;--c:${it.color}">
        <div class="card" title="${esc(it.title)}${it.spanAll ? ' (all rooms)' : ''}${ppl.length ? ' — ' + esc(names(it)) : ''}${notes ? '\n\n' + esc(notes) : ''}${ob ? '\n\nOverbooked: ' + esc(obNames) : ''}"><div class="t-time"><span>${fmt(it.start)}–${fmt(it.end)}</span><span class="d">${dur(it.end - it.start)}</span></div><div class="t-main"><div class="t-head">${ob ? `<span class="obw" title="Overbooked: ${esc(obNames)}">${ICON_WARN}</span>` : ''}<div class="t-title">${it.pinned ? `<span class="pin" title="Pinned">${ICON_PIN}</span>` : ''}${esc(it.title) || '<span class="muted">Untitled</span>'}${it.spanAll ? ' <span class="muted small">(all rooms)</span>' : ''}</div>${notes ? `<span class="t-nicon" hidden>${ICON_NOTE}</span>` : ''}</div>${notes ? `<div class="t-notes">${esc(notes)}</div>` : ''}</div>${ppl.length ? `<div class="t-ppl">${ppl.map(p => avatar(p)).join('')}<span class="more" hidden></span></div>` : ''}</div>
        <div class="h top" data-h="top" title="Drag to change start"></div><div class="h bot" data-h="bottom" title="Drag to change end"></div>
        <button class="plus ptop" data-plus="before" title="Insert item before">+</button><button class="plus pbot" data-plus="after" title="Insert item after">+</button></div>`;
    };
    const rooms = d.rooms.map(r => {
      const rits = vis.filter(i => i.room === r.id && !i.spanAll), lay = lanes(rits);
      const items = rits.map(it => { const L = lay.get(it.id); return itemHtml(it, L.lane / L.n * 100, 100 / L.n); }).join('');
      return `<div class="room" data-day="${d.id}" data-room="${r.id}"><div class="lanes">${items}</div></div>`;
    }).join('');
    const spans = vis.filter(it => it.spanAll).map(it => itemHtml(it, 0, 100)).join('');
    const now = d.date === today && nowM >= ax.s && nowM <= ax.e ? `<div class="now" style="top:${(nowM - ax.s) * ppm}px"></div>` : '';
    const strip = roomsMax > 1 ? `<div class="dh4">${d.rooms.map((r, ri) => `<div class="rtab" data-room="${r.id}"><input class="rin" data-k="roomname" value="${esc(r.name)}" placeholder="Room ${ri + 1}" spellcheck="false" title="Room name"><button class="x" data-act="delroom" title="Delete this room (its items move to another room)">${ICON_X}</button></div>`).join('')}</div>` : '';
    return `<section class="day" data-day="${d.id}"${roomsMax > 1 ? ' style="max-width:880px"' : ''}>
      <div class="day-head">
        <div class="dh1"><span class="dnum">Day ${i + 1}</span><span class="wd">${esc(weekday(d))}</span><span class="sp"></span>
          <button class="ib" data-act="addroom" title="Add a room (parallel track) to this day">+</button>
          <button class="ib" data-act="dup" title="Duplicate day">${ICON_DUP}</button>${doc.days.length > 1 ? `<button class="ib" data-act="del" title="Delete day">${ICON_DEL}</button>` : ''}</div>
        <div class="dh2"><input class="din" data-k="date" data-f="date-${d.id}" value="${esc(d.date)}" placeholder="YYYY-MM-DD" spellcheck="false" title="Date (YYYY-MM-DD, optional)"><button class="ib" data-act="cal" title="Pick a date">${ICON_CAL}</button><input type="date" class="dpick" data-k="datepick" tabindex="-1" value="${esc(d.date)}" aria-hidden="true">
          <input class="tin" data-k="start" data-f="ds-${d.id}" value="${fmt(d.start)}" inputmode="numeric" title="Day start (24h). Changing it shifts the whole day except pinned items. ↑/↓ to step."><span>–</span>
          <input class="tin" data-k="end" data-f="de-${d.id}" data-rel="${d.start}" value="${fmt(d.end)}" inputmode="numeric" title="Day end (24h)"></div>
        <div class="dh3">${vis.length} item${vis.length === 1 ? '' : 's'} · ${dur(work)} of sessions${lastEnd != null ? ` · last ends ${fmt(lastEnd)}` : ''}${dayOb ? ` · <span class="obt">Overbooked ×${dayOb}</span>` : ''}</div>
        ${strip}
      </div>
      <div class="day-body" style="height:${H}px">
        <div class="win" style="top:${wt}px;height:${wh}px;background-position:0 ${-wt - 1}px">
          <div class="edge top"><div class="grip" data-h="daystart" title="Drag to change when the day starts">${ICON_GRIP}${fmt(d.start)}</div><button class="plus" data-plus="daystart" title="Add item at start of day">+</button></div>
          ${vis.length ? '' : '<div class="empty">Click + or double-click<br>to add an agenda item</div>'}
          <div class="edge bot"><div class="grip" data-h="dayend" title="Drag to change when the day ends">${ICON_GRIP}${fmt(d.end)}</div><button class="plus" data-plus="dayend" title="Add item at end of day">+</button></div>
        </div>
        <div class="rooms">${rooms}${spans}</div>${now}
      </div></section>`;
  }).join('');
  queueMicrotask(fitCards);
  $('#board').innerHTML = `<div class="board" style="--ppm:${ppm};--headH:${headH}px"><div class="axis"><div class="axis-head"></div><div class="axis-body" style="height:${H}px">${axis}</div></div>${days}<button class="add-day" data-act="addday" title="Add day">+</button></div>`;
}

/* Show every badge that fits; only collapse the tail into "+n" when they would overflow the card. */
function fitBadges() {
  for (const box of document.querySelectorAll('#board .t-ppl')) {
    const avs = [...box.querySelectorAll('.av')], more = box.querySelector('.more'), card = box.parentElement;
    avs.forEach(a => a.hidden = false); more.hidden = true;
    const cs = getComputedStyle(card), limit = card.getBoundingClientRect().bottom + 1;
    const fits = () => box.scrollWidth <= box.clientWidth + 1 && box.getBoundingClientRect().bottom <= limit;
    if (fits()) continue;
    more.hidden = false;
    for (let shown = avs.length - 1; shown >= 1; shown--) {
      avs[shown].hidden = true; more.textContent = '+' + (avs.length - shown);
      if (fits()) break;
    }
  }
}
/* Notes: show as many lines as fit (last line ends with …); if none fit, show a notes icon by the title. */
function fitNotes() {
  for (const nt of document.querySelectorAll('#board .t-notes')) {
    const card = nt.closest('.card'), icon = card.querySelector('.t-nicon'), main = nt.parentElement;
    if (card.closest('.item').classList.contains('xs')) { nt.hidden = true; icon.hidden = false; continue; }   // one-line items never have room
    nt.hidden = false; nt.style.webkitLineClamp = 'none'; icon.hidden = true;
    const cs = getComputedStyle(card), lh = parseFloat(getComputedStyle(nt).lineHeight) || 15;
    const bottom = Math.min(card.getBoundingClientRect().bottom - parseFloat(cs.paddingBottom) - parseFloat(cs.borderBottomWidth), main.getBoundingClientRect().bottom);
    const lines = Math.floor((bottom - nt.getBoundingClientRect().top + 0.5) / lh);
    const need = Math.round(nt.scrollHeight / lh);
    if (lines < 1) { nt.hidden = true; icon.hidden = false; }
    else if (need > lines) nt.style.webkitLineClamp = String(lines);
  }
}
const fitCards = () => { fitBadges(); fitNotes(); };
let fitT; window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitCards, 60); });

/* ---------- 24h time fields: arrows step, Enter applies, focus selects ---------- */
document.addEventListener('keydown', e => {
  const el = e.target; if (!el.classList || !el.classList.contains('tin')) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault(); const v = parseT(el.value); if (v == null) return;
    const S = doc.snap, n = e.key === 'ArrowUp' ? Math.floor(v / S) * S + S : Math.ceil(v / S) * S - S;
    el.value = fmt(clamp(n, 0, MAX)); el.dispatchEvent(new Event('change', { bubbles: true }));
    const cur = document.activeElement; if (cur && cur.classList.contains('tin')) openTP(cur);
  } else if (e.key === 'Enter') { e.preventDefault(); closeTP(); el.dispatchEvent(new Event('change', { bubbles: true })); el.select(); }
  else if (e.key === 'Escape') { if (!tp.box.hidden) { e.preventDefault(); e.stopPropagation(); closeTP(); } }
  else if (e.key === 'Tab') closeTP();
}, true);
document.addEventListener('focusin', e => {
  const el = e.target; if (!el.classList) return;
  if (el.classList.contains('tin') || el.classList.contains('din')) el.select();
  if (el.classList.contains('tin') && Date.now() > tp.quiet) openTP(el);
});
/* time picker popover */
const tp = { el: null, quiet: 0, box: Object.assign(document.createElement('div'), { id: 'tpop', hidden: true }) };
document.body.appendChild(tp.box);
function openTP(el) {
  tp.el = el;
  const S = doc.snap, v = parseT(el.value), rel = el.dataset.rel != null ? +el.dataset.rel : null;
  const near = v == null ? 540 : Math.round(v / S) * S;
  let h = '';
  for (let m = 0; m <= MAX; m += S) h += `<button type="button" data-m="${m}" class="${m === near ? 'on' : ''}">${fmt(m)}${rel != null && m > rel ? `<small>${dur(m - rel)}</small>` : ''}</button>`;
  tp.box.innerHTML = h; tp.box.classList.toggle('wide', rel != null); tp.box.hidden = false;
  const r = el.getBoundingClientRect(), bh = Math.min(260, window.innerHeight - 20);
  tp.box.style.left = Math.min(r.left, window.innerWidth - tp.box.offsetWidth - 8) + 'px';
  tp.box.style.top = (r.bottom + 4 + bh > window.innerHeight ? Math.max(8, r.top - 4 - bh) : r.bottom + 4) + 'px';
  const on = tp.box.querySelector('.on'); if (on) tp.box.scrollTop = on.offsetTop - tp.box.clientHeight / 2 + on.offsetHeight / 2;
}
function closeTP() { tp.box.hidden = true; tp.el = null; }
tp.box.addEventListener('mousedown', e => {
  e.preventDefault();
  const b = e.target.closest('[data-m]'); if (!b || !tp.el) return;
  const el = tp.el; el.value = fmt(+b.dataset.m); closeTP(); tp.quiet = Date.now() + 400;
  el.dispatchEvent(new Event('change', { bubbles: true }));
});

const board = $('#board');

  ui.downOnItem = !!e.target.closest('.item,.edge,.day-head');
  if (e.button !== 0) return;
  if (e.target.closest('.plus,input,button,select,textarea')) return;
  const h = e.target.closest('[data-h]'), itemEl = e.target.closest('.item'), dayEl = e.target.closest('.day'), roomEl = e.target.closest('.room');
  if (!dayEl || (!h && !itemEl)) return;
  const mode = h ? h.dataset.h : 'move', itemId = itemEl ? itemEl.dataset.id : null;
  const axisStart = axisRange().s;
  ui.drag = { mode, itemId, dayId: dayEl.dataset.day, roomId: roomEl ? roomEl.dataset.room : null, x0: e.clientX, y0: e.clientY, orig: clone(doc), axisStart, moved: false,
    cols: [...board.querySelectorAll('.room')].map(el => ({ day: el.dataset.day, room: el.dataset.room, r: el.getBoundingClientRect() })) };
  if (itemId && ui.sel !== itemId) { ui.sel = itemId; renderAll(); }
  e.preventDefault();
});
window.addEventListener('pointermove', e => {
  const d = ui.drag; if (!d) return;
  const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
  if (!d.moved) { if (Math.abs(dy) < 4 && Math.abs(dx) < 4) return; d.moved = true; document.body.classList.add('dragging'); }
  const S = doc.snap, delta = Math.round(dy / ui.ppm / S) * S;
  let target = { day: d.dayId, room: d.roomId };
  if (d.mode === 'move') { const c = d.cols.find(c => e.clientX >= c.r.left - 7 && e.clientX <= c.r.right + 7); if (c) target = { day: c.day, room: c.room }; }
  applyDrag(d, delta, target, e.shiftKey);
  renderBoard(); renderEditorTimes();
});
function endDrag() {
  const d = ui.drag; if (!d) return;
  ui.drag = null; document.body.classList.remove('dragging');
  if (d.moved) { ui.justDragged = true; setTimeout(() => ui.justDragged = false, 0); commit(); }
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

function applyDrag(d, delta, target, free = false) {
  doc = clone(d.orig);
  const day = getDay(d.dayId), lo = d.axisStart;
  const room = d.roomId || day.rooms[0].id;
  const it = d.itemId ? day.items.find(i => i.id === d.itemId) : null;
  if (d.mode === 'move') {
    const len = it.end - it.start, tday = getDay(target.day) || day;
    const troom = tday.rooms.some(r => r.id === target.room) ? target.room : tday.rooms[0].id;
    if (tday === day && troom === room && !free) {
      const { minD, maxD } = glueLimits(day, it, lo);
      const over = delta < minD ? minD - delta : delta > maxD ? delta - maxD : 0;
      d.unglued = over * ui.ppm >= 28;               // dragged well past where the glue stops it
      if (d.unglued) reorderTo(day, it, delta, lo); else moveGlued(day, it, delta, lo);
      return;
    }
    d.unglued = false;
    if (tday !== day) { day.items.splice(day.items.indexOf(it), 1); tday.items.push(it); }
    it.room = troom;
    it.start = clamp(it.start + delta, lo, MAX - len); it.end = it.start + len; fitDay(tday);
  } else if (d.mode === 'top') setStart(day, it, it.start + delta, lo);
  else if (d.mode === 'bottom') setEnd(day, it, it.end + delta);
  else if (d.mode === 'daystart') {
    const mn = day.items.length ? Math.min(...day.items.map(i => i.start)) : day.end - 15;
    day.start = clamp(day.start + delta, lo, Math.min(mn, day.end - 15));
  } else if (d.mode === 'dayend') {
    const mx = day.items.length ? Math.max(...day.items.map(i => i.end)) : day.start + 15;
    day.end = clamp(day.end + delta, Math.max(mx, day.start + 15), MAX);
  }
}
board.addEventListener('click', e => {
  if (ui.justDragged) return;
  const plus = e.target.closest('[data-plus]');
  if (plus) {
    const day = getDay(plus.closest('.day').dataset.day), m = plus.dataset.plus;
    const roomEl = plus.closest('.room'), rid = roomEl ? roomEl.dataset.room : day.rooms[0].id;
    if (m === 'daystart') insertAt(day, day.start, 'before', rid);
    else if (m === 'dayend') insertAt(day, day.items.length ? Math.max(...day.items.map(i => i.end)) : day.start, 'after', rid);
    else { const it = day.items.find(i => i.id === plus.closest('.item').dataset.id); insertAt(day, m === 'before' ? it.start : it.end, m, rid); }
    return;
  }
  const act = e.target.closest('[data-act]');
  if (act) {
    if (act.dataset.act === 'cal') {
      const p = act.closest('.dh2').querySelector('.dpick');
      try { p.showPicker(); } catch { act.closest('.dh2').querySelector('.din').focus(); toast('Type the date as YYYY-MM-DD'); }
      return;
    }
    dayAction(act.dataset.act, act.closest('.day')?.dataset.day, act.closest('[data-room]')?.dataset.room); return;
  }

  if (!fromItem && !e.target.closest('.item,.day-head,input,button') && ui.sel) { ui.sel = null; renderAll(); }
});
board.addEventListener('dblclick', e => {
  if (e.target.closest('.item,.day-head,.edge,button,input')) return;
  const roomEl = e.target.closest('.room'); if (!roomEl) return;
  const day = getDay(roomEl.dataset.day), ax = axisRange(), r = roomEl.getBoundingClientRect();
  const t = Math.floor((ax.s + (e.clientY - r.top) / ui.ppm) / 15) * 15;

});
board.addEventListener('change', e => {
  const el = e.target, dayEl = el.closest('.day'); if (!dayEl || !el.dataset.k) return;
  const day = getDay(dayEl.dataset.day), k = el.dataset.k;
  if (k === 'roomname') {
    const rtab = el.closest('[data-room]'), rm = rtab && day.rooms.find(r => r.id === rtab.dataset.room);
    if (rm) { rm.name = el.value.trim(); commit(); }
    return;
  }
  if (k === 'date' || k === 'datepick') {
    const v = parseD(el.value);
    if (v == null) { toast('Use the format YYYY-MM-DD'); renderBoard(); return; }
    if (v === day.date) { el.value = v; return; }
    day.date = v;
  } else if (k === 'start') {
    const v = parseT(el.value);
    if (v == null) { toast('Use 24h time, e.g. 09:30'); renderBoard(); return; }
    if (v === day.start) { el.value = fmt(v); return; }
    const free = day.items.filter(i => !i.pinned);
    const maxEnd = Math.max(day.end, ...free.map(i => i.end));
    const minStart = Math.min(day.start, ...free.map(i => i.start));
    const diff = clamp(v - day.start, -minStart, MAX - maxEnd);
    day.start += diff; day.end += diff; for (const i of free) { i.start += diff; i.end += diff; }
    fitDay(day);
    if (diff && day.items.length) toast(`Shifted the day by ${diff > 0 ? '+' : '−'}${dur(Math.abs(diff))}${free.length < day.items.length ? ' (pinned items kept)' : ''}`);
  } else if (k === 'end') {
    const v = parseT(el.value);
    if (v == null) { toast('Use 24h time, e.g. 17:00'); renderBoard(); return; }
    if (v === day.end) { el.value = fmt(v); return; }
    const mx = day.items.length ? Math.max(...day.items.map(i => i.end)) : day.start + 15;
    day.end = clamp(v, Math.max(mx, day.start + 15), MAX);
    if (v < mx) toast(`The day can't end before its last item (${fmt(mx)})`);
  }
  commit();
});

function savePerson() {
  const row = $('[data-epid]'); if (!row) return;
  const p = person(row.dataset.epid); if (!p) { ui.editPid = null; renderSide(); return; }
  const name = $('[data-f=pname]', row).value.trim().replace(/\s+/g, ' ');
  if (!name) { toast('Name cannot be empty'); return; }
  const clash = doc.participants.find(x => x !== p && x.name.toLowerCase() === name.toLowerCase());
  if (clash) { toast(`${clash.name} is already in this agenda`); return; }
  const ini = cleanIni($('[data-f=pini]', row).value);
  const col = p.color;
  delete p.initials; delete p.color; Object.assign(p, mkPerson(p.id, name, ini, col));
  endPersonEdit(); learnPeople([p]); commit();
}
function startPersonEdit(id) { ui.editPid = id; ui.editOrig = clone(person(id)); ui.editDraft = null; ui.focusPname = true; }
function endPersonEdit() { ui.editPid = null; ui.editOrig = null; ui.editDraft = null; }

/* colour changes apply straight away so you see them on the badges */
function setPersonColor(color, final = true) {

}
const side = $('#sideDyn');
side.addEventListener('click', async e => {
  if (e.target.closest('[data-psave]')) { savePerson(); return; }

  const pc = e.target.closest('[data-pcol]');

  if (e.target.closest('.editing')) return;
  const del = e.target.closest('[data-del]');
  if (del) {
    const p = person(del.dataset.del); if (!p) return;
    const used = doc.days.some(d => d.items.some(i => i.participants.includes(p.id)));
    if (used && !(await ask(`Remove ${p.name} from the agenda and all its items?`, 'Remove', true))) return;
    doc.participants = doc.participants.filter(x => x !== p);
    doc.days.forEach(d => d.items.forEach(i => i.participants = i.participants.filter(x => x !== p.id)));
    if (ui.hl === p.id) ui.hl = null; commit(); return;
  }
  const ren = e.target.closest('[data-ren]');
  if (ren) { startPersonEdit(ren.dataset.ren); renderSide(); return; }
  if (e.target.closest('[data-side=learn]')) { learnFolder(); return; }
  if (e.target.closest('[data-side=prune]')) {
    const used = new Set(doc.days.flatMap(d => d.items.flatMap(i => i.participants)));
    const gone = doc.participants.filter(p => !used.has(p.id)); if (!gone.length) return;
    doc.participants = doc.participants.filter(p => used.has(p.id));
    if (ui.hl && !used.has(ui.hl)) ui.hl = null;
    if (ui.editPid && !used.has(ui.editPid)) endPersonEdit();
    commit(); toast(`Removed ${gone.length} unassigned participant${gone.length > 1 ? 's' : ''} — Ctrl+Z to undo`); return;
  }
  const row = e.target.closest('[data-pid]');
  if (row) {
    ui.hl = ui.hl === row.dataset.pid ? null : row.dataset.pid;
    side.querySelectorAll('[data-pid]').forEach(r => r.classList.toggle('on', r.dataset.pid === ui.hl));

});

ed.addEventListener('input', e => {

ed.addEventListener('change', e => {
  const f = findItem(ui.sel); if (!f) return;
  const { day, it } = f, k = e.target.dataset.f, v = e.target.value;
  if (k === 'title' || k === 'notes') return commit(false);
  if (k === 'sensitive') { it.sensitive = e.target.checked; return commit(); }
  if (k === 'start' || k === 'end') {
    const t = parseT(v);
    if (t == null) { toast('Use 24h time, e.g. 13:45'); renderEditorTimes(); return; }
    if (t === (k === 'start' ? it.start : it.end)) { renderEditorTimes(); return; }
    const got = k === 'start' ? setStart(day, it, t) : setEnd(day, it, t);
    if (got !== t) toast(`Limited to ${fmt(got)} by a neighbouring or pinned item`);
    return commit(false);
  }
  if (k === 'day') { const nd = getDay(v); if (nd && nd !== day) { day.items.splice(day.items.indexOf(it), 1); nd.items.push(it); it.room = nd.rooms[0].id; fitDay(nd); } return commit(); }
  if (k === 'room') { if (day.rooms.some(r => r.id === v)) it.room = v; return commit(); }
});
ed.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;

  if (b.dataset.e === 'close') { ui.sel = null; renderAll(); return; }
  const f = findItem(ui.sel); if (!f) return;
  const { it } = f;
  if (b.dataset.color) { it.color = b.dataset.color; commit(); }
  else if (b.dataset.type) { it.type = b.dataset.type; if (it.type === 'break' && /^new item$/i.test(it.title)) it.title = 'Break'; commit(); }
  else if (b.dataset.rm) { it.participants = it.participants.filter(x => x !== b.dataset.rm); commit(); }
  else if (b.dataset.e === 'span') { it.spanAll = !it.spanAll; commit(); toast(it.spanAll ? 'Stretched across all rooms of the day' : 'Back to a single room'); }
  else if (b.dataset.e === 'pin') togglePin();
  else if (b.dataset.e === 'del') delItem();

  else if (b.dataset.e === 'all') { for (const p of doc.participants) if (!it.participants.includes(p.id)) it.participants.push(p.id); commit(); }

/* ---------- files ---------- */
const FILE_TYPES = [{ description: 'Agenda file', accept: { 'application/json': ['.json'] } }];
function download(data, name, type) {
  const b = data instanceof Blob ? data : new Blob([data], { type });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
const inFrame = (() => { try { return window.top !== window; } catch { return true; } })();
async function save(as) {
  const json = JSON.stringify(doc, null, 2);
  if ('showSaveFilePicker' in window && !inFrame) {
    try {
      if (as || !ui.handle) ui.handle = await showSaveFilePicker({ suggestedName: ui.fileName || slug(doc.title) + '.agenda.json', types: FILE_TYPES });
      const w = await ui.handle.createWritable(); await w.write(json); await w.close();
      ui.fileName = ui.handle.name; ui.savedJson = JSON.stringify(doc); saveDraft(); renderTop();
      return toast('Saved to ' + ui.fileName);
    } catch (err) {
      if (err.name === 'AbortError') return;
      if (err.name !== 'SecurityError') return toast('Save failed: ' + err.message);
    }
  }
  const why = inFrame
    ? 'This page is running inside a preview frame, so the browser won’t show a save dialog here. Open the HTML file directly in Edge or Chrome to save to a file and folder of your choice.'
    : 'This browser can’t save straight to a chosen file (Edge and Chrome can). In Firefox, turn on “Always ask you where to save files” to pick the folder each time.';
  const name = await ask(`${why}\n\nThe agenda will be downloaded to your Downloads folder as:`, 'Download', false, ui.fileName || slug(doc.title) + '.agenda.json');
  if (!name) return;
  const fname = /\.json$/i.test(name) ? name : name + '.agenda.json';
  download(json, fname, 'application/json');
  ui.handle = null; ui.fileName = fname; ui.savedJson = JSON.stringify(doc); ui.downloaded = true; saveDraft(); renderTop();
  toast(`Downloaded ${fname}`);
}
const confirmDiscard = async () => !isDirty() || await ask('You have unsaved changes. Discard them?', 'Discard', true);
async function openFile() {
  if (!(await confirmDiscard())) return;
  if ('showOpenFilePicker' in window && !inFrame) {
    try { const [h] = await showOpenFilePicker({ types: FILE_TYPES }); const f = await h.getFile(); loadText(await f.text(), h.name, h); return; }
    catch (err) { if (err.name === 'AbortError') return; if (err.name !== 'SecurityError') return toast('Could not open: ' + err.message); }
  }
  $('#fileInput').click();
}
$('#fileInput').onchange = async e => { const f = e.target.files[0]; if (f) loadText(await f.text(), f.name, null); e.target.value = ''; };
function loadText(text, name, handle) {
  try {
    doc = normalize(JSON.parse(text));
    ui.handle = handle || null; ui.fileName = name; ui.savedJson = JSON.stringify(doc); ui.sel = null; ui.hl = null; ui.editPid = null;
    resetHistory(); learnPeople(doc.participants); saveDraft(); renderAll(); toast('Opened ' + name);
  } catch { toast('That file is not a valid agenda'); }
}
async function newAgenda() {
  if (!(await confirmDiscard())) return;
  doc = normalize({ title: 'Untitled agenda', snap: doc.snap, participants: [], days: [{ date: isoToday(), start: 540, end: 1020, rooms: [{ id: uid(), name: '' }], items: [] }] });
  ui.handle = null; ui.fileName = null; ui.sel = null; ui.hl = null; ui.editPid = null; ui.savedJson = JSON.stringify(doc);
  resetHistory(); saveDraft(); renderAll(); titleIn.focus(); titleIn.select();
}
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', async e => {
  e.preventDefault();
  const item = [...(e.dataTransfer?.items || [])].find(i => i.kind === 'file'); if (!item) return;
  const file = item.getAsFile(), hp = item.getAsFileSystemHandle ? item.getAsFileSystemHandle() : null;
  const text = await file.text();
  if (!(await confirmDiscard())) return;
  let handle = null; try { handle = hp ? await hp : null; } catch {}
  loadText(text, file.name, handle && handle.kind === 'file' ? handle : null);
});
async function learnFolder() {
  if (!('showDirectoryPicker' in window)) return toast('Folder access needs Edge or Chrome');
  try {
    const dir = await showDirectoryPicker(); let n = 0, files = 0;
    for await (const [name, h] of dir.entries()) {
      if (h.kind !== 'file' || !name.toLowerCase().endsWith('.json')) continue;
      try { const d = JSON.parse(await (await h.getFile()).text()); if (Array.isArray(d.participants) && Array.isArray(d.days)) { files++; n += learnPeople(d.participants.map(p => ({ name: String(p.name || ''), initials: cleanIni(p.initials) || undefined }))); } } catch {}

      o.push(`<text x="${tx}" y="${iy + pad + 11.5}" font-size="10.5" fill="#5d6472">${fmt(it.start)}–${fmt(it.end)}</text>`);
      if (side && ih >= PAD + 30 + PAD) o.push(`<text x="${tx}" y="${iy + PAD + 25}" font-size="10" fill="#8a909c">${dur(it.end - it.start)}</text>`);
      if (!side) cy += 15;
      // title
      tLines.forEach((l, k) => o.push(`<text x="${cx}" y="${cy + 12.5 + k * 17}" font-size="13" font-weight="650" fill="${tcol}">${esc(l)}</text>`));
      // participants
      if (inline) {
        let bx = cx + colW - ppl.length * BS + 4 + B / 2;   // flush right; the note marker sits by the title
        for (const p of ppl) { o.push(svgAv(p, bx, cy + 8, B / 2)); bx += BS; }
      } else if (rows) {
        const by = cy + tLines.length * 17 + 5;
        ppl.forEach((p, k) => o.push(svgAv(p, cx + (k % perRow) * BS + B / 2, by + Math.floor(k / perRow) * BS + B / 2, B / 2)));
      }
      // notes inline or as a reference
      if (notes) {
        const nLines = wrapText(notes, 11, 400, colW), ny = cy + contentH + 4, room = iy + ih - PAD - ny;
        if (nLines.length * 14 <= room) nLines.forEach((l, k) => o.push(`<text x="${cx}" y="${ny + 11 + k * 14}" font-size="11" fill="#6b7280" font-style="italic">${esc(l)}</text>`));
        else {
          const num = refs.length + 1;
          refs.push({ num, head: `${it.spanAll ? 'All rooms · ' : anyMulti ? (r.name || `Room ${ri + 1}`) + ' · ' : ''}${all.length > 1 || d.date ? dayLabel(d, di) + ' · ' : ''}${fmt(it.start)}–${fmt(it.end)} · ${it.title || 'Untitled'}`, notes });
          const last = tLines.length - 1, mx = cx + tw(tLines[last], 13, 650) + 6 + 8, my = cy + 8 + last * 17;
          o.push(`<circle cx="${mx}" cy="${my}" r="8" fill="#151821"/><text x="${mx}" y="${my + 3.6}" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">${num}</text>`);
        }
      }
    }
  });

  /* 4. legend */
  const lx = P + AX + n * CW + (n - 1) * G + LG;
  let ly = top - 26;
  const stats = new Map();
  for (const d of doc.days) for (const it of visibleItems(d)) for (const id of it.participants) { const st = stats.get(id) || { n: 0, m: 0 }; st.n++; st.m += it.end - it.start; stats.set(id, st); }
  if (people.length) {
    o.push(`<text x="${lx}" y="${ly}" font-size="11" font-weight="700" fill="#687080" letter-spacing="0.8">PARTICIPANTS</text>`);
    ly += 14;
    for (const p of people) {
      const nm = wrapText(p.name, 13, 600, LEGW - 36), st = stats.get(p.id);
      o.push(svgAv(p, lx + 12, ly + 12, 12));
      nm.forEach((l, k) => o.push(`<text x="${lx + 34}" y="${ly + 10 + k * 16}" font-size="13" font-weight="600" fill="#151821">${esc(l)}</text>`));
      o.push(`<text x="${lx + 34}" y="${ly + 10 + nm.length * 16}" font-size="11" fill="#8a909c">${st ? `${st.n} item${st.n > 1 ? 's' : ''} · ${dur(st.m)}` : 'Not assigned'}</text>`);
      ly += Math.max(30, nm.length * 16 + 18) + 6;
    }
  }

  /* 5. notes that did not fit */
  let y = Math.max(gridBottom, ly) + 34;
  if (refs.length) {
    const nx = P + 34, nw = W - P - nx;
    o.push(`<line x1="${P}" x2="${W - P}" y1="${y - 14}" y2="${y - 14}" stroke="#e2e5eb"/>`);
    o.push(`<text x="${P}" y="${y + 6}" font-size="16" font-weight="700" fill="#151821">Notes</text><text x="${P + 56}" y="${y + 6}" font-size="12" fill="#8a909c">that didn't fit in the agenda above</text>`);
    y += 22;
    for (const r of refs) {
      y += 6;
      o.push(`<circle cx="${P + 10}" cy="${y + 8.5}" r="10" fill="#151821"/><text x="${P + 10}" y="${y + 12.5}" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">${r.num}</text>`);
      const hl = wrapText(r.head, 12.5, 650, nw);
      hl.forEach((l, k) => o.push(`<text x="${nx}" y="${y + 13 + k * 17}" font-size="12.5" font-weight="650" fill="#151821">${esc(l)}</text>`));
      y += hl.length * 17 + 2;
      const nl = wrapText(r.notes, 12, 400, nw);
      nl.forEach((l, k) => o.push(`<text x="${nx}" y="${y + 13 + k * 17}" font-size="12" fill="#3f4652">${esc(l)}</text>`));
      y += nl.length * 17 + 10;
    }
  }
  const H = Math.ceil(y - 34 + P + (refs.length ? 10 : 0));
  return { svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${FONT}"><rect width="${W}" height="${H}" fill="#ffffff"/>${o.join('')}</svg>`, W, H };
}
async function pngBlob() {
  const { svg, W, H } = buildSVG(), img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const s = 2, c = document.createElement('canvas'); c.width = W * s; c.height = H * s;
  const g = c.getContext('2d'); g.scale(s, s); g.drawImage(img, 0, 0, W, H);
  return new Promise(r => c.toBlob(r, 'image/png'));
}
/* ---------- export preview ---------- */
const XTABS = {
  md: { label: 'Markdown', note: 'Edit freely before copying or downloading. Edits here don’t change the agenda.', dl: 'Download .md', copy: 'Copy text' },
  html: { label: 'Formatted', note: 'Pastes with headings and bullet lists into Outlook, Teams or Word.', dl: 'Download .html', copy: 'Copy formatted' },
  table: { label: 'Table', note: 'Pastes as a real table into Excel, Word, Outlook or Teams.', dl: 'Download .html', copy: 'Copy table' },
  img: { label: 'Image', note: '', dl: 'Download PNG', copy: 'Copy image' }
};
let xp = null;
function openExport(tab) {
  closeExport();
  tab = XTABS[tab] ? tab : (XTABS[LS.get('agenda.xtab', 'md')] ? LS.get('agenda.xtab', 'md') : 'md');
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'xmodal';
  m.innerHTML = `<div class="dlg xdlg" role="dialog" aria-label="Export preview">
    <div class="xhead"><b>Export preview</b><div class="seg">${Object.entries(XTABS).map(([k, v]) => `<button data-xt="${k}">${v.label}</button>`).join('')}</div>
      <span class="sp"></span><button class="ib" data-xclose title="Close (Esc)">${ICON_X}</button></div>
    <div class="xbody"></div>
    <div class="xfoot"><span class="xnote small muted"></span><span class="sp"></span>
      <button class="btn" data-xa="print">Print / PDF</button><button class="btn" data-xa="download"></button><button class="btn primary" data-xa="copy"></button></div></div>`;
  document.body.appendChild(m);
  const kd = e => { if (e.key === 'Escape' && !document.querySelector('.modal:not(#xmodal)')) { e.preventDefault(); e.stopPropagation(); closeExport(); } };
  document.addEventListener('keydown', kd, true);
  xp = { m, kd, tab: null, md: agendaText(), blob: null, url: null, size: null };
  m.addEventListener('click', e => {
    if (e.target === m || e.target.closest('[data-xclose]')) return closeExport();
    const t = e.target.closest('[data-xt]'); if (t) return showXTab(t.dataset.xt);
    const a = e.target.closest('[data-xa]'); if (a) xAction(a.dataset.xa);
  });
  m.addEventListener('input', e => { if (e.target.matches('.xmd')) xp.md = e.target.value; });
  showXTab(tab);
}
function closeExport() {
  if (!xp) return;
  document.removeEventListener('keydown', xp.kd, true);
  if (xp.url) URL.revokeObjectURL(xp.url);
  xp.m.remove(); xp = null;
}
async function showXTab(tab) {
  if (!xp) return;
  xp.tab = tab; LS.set('agenda.xtab', tab);
  const m = xp.m, body = $('.xbody', m), info = XTABS[tab];
  m.querySelectorAll('[data-xt]').forEach(b => b.classList.toggle('on', b.dataset.xt === tab));
  $('[data-xa=download]', m).textContent = info.dl; $('[data-xa=copy]', m).textContent = info.copy;
  $('.xnote', m).textContent = info.note;
  if (tab === 'md') {
    body.innerHTML = '<textarea class="xmd" spellcheck="false"></textarea>';
    const ta = $('.xmd', body); ta.value = xp.md; ta.focus(); ta.setSelectionRange(0, 0); ta.scrollTop = 0;
  } else if (tab === 'html') {
    body.innerHTML = `<div class="xpaper">${agendaHTML()}</div>`;
  } else if (tab === 'table') {
    body.innerHTML = `<div class="xpaper xtable">${agendaTableHTML()}</div>`;
  } else {
    body.innerHTML = '<div class="xpaper ximg"><span class="muted small">Rendering…</span></div>';
    if (!xp.blob) {
      const { W, H } = buildSVG(); xp.size = `${W * 2} × ${H * 2} px`; xp.w = W;
      xp.blob = await pngBlob(); if (!xp) return;
      xp.url = URL.createObjectURL(xp.blob);
    }
    if (xp.tab !== 'img') return;
    body.innerHTML = `<div class="xpaper ximg"><img src="${xp.url}" style="width:${xp.w}px" alt="Agenda as an image"></div>`;
    $('.xnote', m).textContent = `PNG, ${xp.size}`;
  }
}
async function xAction(a) {
  if (!xp) return;
  const name = slug(doc.title), tab = xp.tab;
  if (a === 'print') { closeExport(); setTimeout(() => window.print(), 50); return; }
  if (tab === 'md') {
    if (a === 'copy') toast(await copyPlain(xp.md) ? 'Markdown copied' : 'Copy failed');
    else { download(xp.md, name + '.md', 'text/markdown'); toast(`Downloaded ${name}.md`); }
  } else if (tab === 'html') {
    const html = agendaHTML();
    if (a === 'copy') toast(await copyRich(html, xp.md) ? 'Copied. Paste into an email, Teams or a document' : 'Copy failed');
    else { download(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(doc.title)}</title></head><body style="max-width:760px;margin:40px auto;padding:0 20px">${html}</body></html>`, name + '.html', 'text/html'); toast(`Downloaded ${name}.html`); }
  } else if (tab === 'table') {
    const html = agendaTableHTML();
    if (a === 'copy') toast(await copyRich(html, agendaTableTSV()) ? 'Copied. Paste into Excel, Word, Outlook or Teams' : 'Copy failed');
    else { download(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(doc.title)}</title></head><body style="max-width:1000px;margin:40px auto;padding:0 20px">${html}</body></html>`, name + '.table.html', 'text/html'); toast(`Downloaded ${name}.table.html`); }
  } else {
    if (!xp.blob) return;
    if (a === 'copy') {
      try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': xp.blob })]); toast('Image copied to clipboard'); }
      catch { toast("This browser can't copy images here. Use Download PNG"); }
    } else { download(xp.blob, name + '.png'); toast(`Downloaded ${name}.png`); }
  }
}

/* ---------- toast & init ---------- */
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2800); }

const draft = LS.get('agenda.draft', null);
try {
  if (draft && draft.doc) { doc = normalize(draft.doc); ui.fileName = draft.fileName || null; ui.savedJson = draft.savedJson || JSON.stringify(doc); }
  else throw 0;
} catch { doc = normalize(sampleDoc()); ui.savedJson = JSON.stringify(doc); }
// keep the sample agenda's names out of the suggestions
if (!LS.get('agenda.samplePurged', false)) {
  const drop = new Set(SAMPLE_NAMES.map(n => n.toLowerCase()));
  LS.set('agenda.people', LS.get('agenda.people', []).filter(k => !drop.has(k.name.toLowerCase())));
  LS.set('agenda.samplePurged', true);
}
learnPeople(doc.participants.filter(p => !SAMPLE_NAMES.includes(p.name)));
resetHistory(); renderAll();
if (draft && draft.doc && draft.fileName && isDirty()) toast(`Restored unsaved changes to ${draft.fileName}`);
setInterval(() => { if (!ui.drag) renderBoard(); }, 60000);
if (Date.now() - LS.get('agenda.lastUpdateCheck', 0) > 86400000) setTimeout(() => checkForUpdates(false), 1500);
window.__agenda = { get doc() { return doc; }, ui };
})();
</script>
